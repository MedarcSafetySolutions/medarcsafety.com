(async function () {
  const m = document.getElementById('m');
  const toGate = () => { if (window.top === window) location.replace('./#simulator'); else m.innerHTML = '<p>Please enter your access code again.</p>'; };
  let r = null; try { r = JSON.parse(localStorage.getItem('medarc-access') || 'null'); } catch (x) {}
  if (!r || r.v !== LOCK.version || !r.ck) return toGate();
  if (r.x && new Date().toISOString().slice(0, 10) > r.x) return toGate();   // past its last day (the access screen says so)
  if (!(window.crypto && crypto.subtle && window.DecompressionStream)) { m.innerHTML = '<p>This browser can’t open the simulator. Please use the latest Safari, Chrome or Edge.</p>'; return; }
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0)), te = new TextEncoder();
  try {
    const w = LOCK.wraps[r.id]; if (!w) throw new Error('inactive');
    const ek = await crypto.subtle.importKey('raw', b64(r.ck), 'AES-GCM', false, ['decrypt']);
    const ks = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(w[0]), additionalData: te.encode('arctin-sim-key') }, ek, b64(w[1]));
    const key = await crypto.subtle.importKey('raw', ks, 'AES-GCM', false, ['decrypt']);
    const packed = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(LOCK.iv), additionalData: te.encode('arctin-sim') }, key, b64(LOCK.ct));
    let html = await new Response(new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
